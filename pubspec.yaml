name: valley_of_arts
description: "Official Valley of Arts festival companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  easy_localization: ^3.0.8
  flutter_dotenv: ^6.0.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.3
  get_it: ^8.0.3
  go_router: ^17.0.0
  injectable: ^2.5.0
  intl: ^0.20.2
  isar_community: #^3.3.0
    git:
      url: https://github.com/bradintheusa/isar-community
      path: packages/isar_community
  isar_community_flutter_libs: ^3.3.0
#    git:
#      url: https://github.com/bradintheusa/isar-community
#      path: packages/isar_community_flutter_libs
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  retrofit: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.5
  easy_localization_generator: ^0.3.5
  flutter_lints: ^6.0.0
  injectable_generator: ^2.7.0
  isar_community_generator: #^3.3.0
    git:
      url: https://github.com/bradintheusa/isar-community
      path: packages/isar_community_generator
  json_serializable: ^6.9.5
  mockito: ^5.4.6
  retrofit_generator: ^10.2.1

dependency_overrides:
  analyzer: ^8.4.1
  isar_community: #^3.3.0
    git:
      url: https://github.com/bradintheusa/isar-community
      path: packages/isar_community

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/translations/
